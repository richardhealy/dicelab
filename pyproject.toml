[project]
name = "dicelab"
version = "0.1.0"
description = "A dice DSL that rolls and reasons: seeded rolls and exact distributions."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.138.1",
    "numpy>=2.5.0",
    "pydantic>=2.7",
    "rich>=15.0.0",
    "typer>=0.12",
    "uvicorn[standard]>=0.49.0",
]

[project.scripts]
dicelab = "dicelab.cli:main"

[build-system]
requires = ["uv_build>=0.10.2,<0.11.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["dicelab"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "hypothesis>=6.155.7",
    "matplotlib>=3.11.0",
    "mypy>=2.1.0",
    "pre-commit>=4.6.0",
    "pytest>=9.1.1",
    "ruff>=0.15.20",
]
